<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">从读取仓库到交付 README 草稿</title>
  <desc id="desc">读取仓库，理清用途与读者，挑选真实素材，重组内容与版式，核对链接与事实，交付 README 草稿。</desc>
  <defs>
    <path id="paper" d="M0 0H176V121L165 119 155 123 142 120 130 124 116 120 103 122 89 119 76 123 62 120 49 124 35 120 23 123 10 119 0 122Z"/>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <path id="arrow" d="M0 0H16M11-5 16 0 11 5" fill="none" stroke="#9b5743" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect width="1200" height="160" rx="6" fill="#faf7f0"/>
  <g fill="#e6dfd2">
    <use href="#paper" x="12" y="24"/><use href="#paper" x="212" y="24"/>
    <use href="#paper" x="412" y="24"/><use href="#paper" x="612" y="24"/>
    <use href="#paper" x="812" y="24"/><use href="#paper" x="1012" y="24"/>
  </g>
  <g fill="#fffdf7" stroke="#d8ccba" stroke-width="1">
    <use href="#paper" x="10" y="20"/><use href="#paper" x="210" y="20"/>
    <use href="#paper" x="410" y="20"/><use href="#paper" x="610" y="20"/>
    <use href="#paper" x="810" y="20"/>
  </g>
  <use href="#paper" x="1010" y="20" fill="#934b37"/>
  <rect x="0" y="0" width="1200" height="160" rx="6" filter="url(#grain)" opacity="0.045"/>
  <g>
    <use href="#arrow" x="190" y="82"/><use href="#arrow" x="390" y="82"/>
    <use href="#arrow" x="590" y="82"/><use href="#arrow" x="790" y="82"/>
    <use href="#arrow" x="990" y="82"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g fill="#9b5743" font-size="20" font-weight="600" letter-spacing="1.5">
      <text x="26" y="54">01</text><text x="226" y="54">02</text>
      <text x="426" y="54">03</text><text x="626" y="54">04</text>
      <text x="826" y="54">05</text><text x="1026" y="54" fill="#f7debd">06</text>
    </g>
    <g stroke="#dbcebb" stroke-width="1">
      <path d="M26 68H170M226 68H370M426 68H570M626 68H770M826 68H970"/>
      <path d="M1026 68H1170" stroke="#ba8166"/>
    </g>
    <g fill="#302b25" font-size="20" font-weight="600">
      <text x="26" y="105">读取仓库</text>
      <text x="226" y="105">理清用途与读者</text>
      <text x="426" y="105">挑选真实素材</text>
      <text x="626" y="105">重组内容与版式</text>
      <text x="826" y="105">核对链接与事实</text>
      <text x="1026" y="105" fill="#fff9ed">README 草稿</text>
    </g>
  </g>
</svg>
